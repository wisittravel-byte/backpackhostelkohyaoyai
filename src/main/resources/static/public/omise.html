<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omise Payment Test</title>
    <script src="https://cdn.omise.co/omise.js"></script>
</head>
<body>

    <h1>Omise Payment Test</h1>
    <form id="payment-form">
        <label for="card-number">Card Number:</label>
        <input type="text" id="card-number" placeholder="Card Number" required>
        <br><br>
        
        <label for="card-expiry-month">Expiry Month:</label>
        <input type="text" id="card-expiry-month" placeholder="MM" required>
        <br><br>

        <label for="card-expiry-year">Expiry Year:</label>
        <input type="text" id="card-expiry-year" placeholder="YY" required>
        <br><br>

        <label for="card-cvc">CVC:</label>
        <input type="text" id="card-cvc" placeholder="CVC" required>
        <br><br>

        <button type="submit">Pay Now</button>
    </form>

    <script>
        Omise.setPublicKey('your-public-key'); // Replace with your actual public key

        const form = document.getElementById('payment-form');
        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const card = {
                number: document.getElementById('card-number').value,
                exp_month: document.getElementById('card-expiry-month').value,
                exp_year: document.getElementById('card-expiry-year').value,
                security_code: document.getElementById('card-cvc').value
            };

            Omise.createToken('card', card, function (statusCode, response) {
                if (response.object === 'token') {
                    // Send the token to your backend
                    fetch('/charge.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            token: response.id
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        console.log(data);
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
                } else {
                    console.error('Error:', response.message);
                }
            });
        });
    </script>

</body>
</html>
