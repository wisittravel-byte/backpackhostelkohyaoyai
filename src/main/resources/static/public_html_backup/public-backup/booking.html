  <!-- hreflang for SEO multi-language -->
  <link rel="alternate" hreflang="th" href="https://www.backpackkohyao.com/booking.html" />
  <link rel="alternate" hreflang="en" href="https://www.backpackkohyao.com/booking.html?lang=en" />
  <link rel="alternate" hreflang="x-default" href="https://www.backpackkohyao.com/booking.html" />
  <title>Booking — Backpack Hostel Kohyaoyai</title>
  <meta name="description" content="หน้าจอการจอง — Backpack Hostel Kohyaoyai">
  <link rel="stylesheet" href="assets/css/shared-header.css">
  <link rel="stylesheet" href="./assets/css/booking.css?v=20251031-currency-tax">
  <link rel="stylesheet" href="assets/css/booking-drawer.css">
  <link rel="stylesheet" href="assets/css/site-footer.css">
  <link rel="stylesheet" href="assets/css/site-base.css">
  <link rel="stylesheet" href="assets/css/spacing.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litepicker/dist/css/litepicker.css">
  <script src="assets/js/messages.js" defer></script>
</head>
<body>
  <div class="site-header header-sticky"></div>
  <div class="wrap header-gap compact">

    <main>
      <section class="card search-sticky">
        <form id="searchBar" class="grid search-grid">
            <div class="dates">
              <label for="daterange" data-i18n="form.dates">วันที่</label>
              <input id="daterange" type="text" required class="form-control" readonly />
              <input id="checkin" type="hidden" />
              <input id="checkout" type="hidden" />
            </div>
            <div>
              <label for="guests" data-i18n="form.guests">จำนวนผู้เข้าพัก</label>
              <select id="guests" class="form-control"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select>
            </div>
            <div>
              <label for="rooms" data-i18n="form.rooms">จำนวนห้อง</label>
              <select id="rooms" class="form-control"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
            </div>
            <div class="actions flex items-center">
              <a class="btn" href="#rooms" data-i18n="form.search">ค้นหา</a>
            </div>
        </form>
      </section>
      
      <section id="rooms" class="card mt-12">
        <h3 data-i18n="rooms.title">ประเภทห้องพัก</h3>
        <!-- Floating cart icon to open Booking Summary drawer (non-invasive) -->
        <button class="bs-open" type="button" data-bs-open aria-label="สรุปการจอง">
          <span class="bs-ic" aria-hidden="true">🛒</span>
          <span class="bs-badge" aria-hidden="true">0</span>
        </button>
        <!-- Tabs: Rooms | Dorm Beds -->
        <div class="tabs mt-8" id="roomTabs" role="tablist" aria-label="Room type tabs">
          <button id="tabRooms" class="tab active" role="tab" aria-selected="true" aria-controls="panelRooms" data-tab="rooms" data-i18n="rooms.tab.private">ห้องพัก</button>
          <button id="tabBeds" class="tab" role="tab" aria-selected="false" aria-controls="panelBeds" data-tab="beds" data-i18n="rooms.tab.dorm">เตียง Dorm</button>
        </div>

        <!-- Panel: Rooms (dynamic; rendered by booking.js) -->
        <div id="panelRooms" class="tab-panel">
          <!-- Results will be injected here by booking.js → renderAvailList('panelRooms', ...) -->
        </div>

        <!-- Panel: Beds (Dorm types) → dynamic; rendered by booking.js -->
        <div id="panelBeds" class="tab-panel hidden" role="tabpanel" aria-labelledby="tabBeds">
          <!-- Results will be injected here by booking.js → renderAvailList('panelBeds', ...) -->
        </div>
      
      </section>
    </main>
    <div class="site-footer"></div>
  </div>

  <script src="assets/js/session-id.js"></script>
  <script src="./assets/js/booking.js?v=20251105-debug-rooms-detail"></script>
  <!-- Drawer controller must load after booking.js so we can intercept its handlers safely -->
  <script src="assets/js/booking-drawer.js?v=20251105-rooms-array" defer></script>
  <script src="assets/js/index-search.js" defer></script>

  <script src="assets/js/i18n.js?v=20251005f" defer></script>
  <script src="assets/js/header-content.js" defer></script>
  <script src="assets/js/load-shared-header.js" defer></script>
  <script src="assets/js/header-menu.js" defer></script>
  <script src="assets/js/footer-content.js" defer></script>
  <script src="assets/js/date-hint-fallback.js" defer></script>
  <script src="assets/js/load-shared-footer.js" defer></script>

  <script src="https://cdn.jsdelivr.net/npm/litepicker/dist/bundle.min.js"></script>
  <script src="assets/js/date-range-single.js?v=20251002"></script>
  <script src="assets/js/index-tabs.js?v=20251005" defer></script>

  <!-- Modal root for room details popup -->
  <div id="roomModal" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="roomModalTitle">
    <div class="modal-overlay" data-close="true"></div>
    <div class="modal-panel" role="document">
      <button class="modal-close" aria-label="Close" data-close="true">×</button>
      <div class="modal-content">
        <div class="modal-gallery" aria-hidden="true"></div>
        <div class="modal-details">
          <h3 id="roomModalTitle" class="modal-title">ข้อมูลห้องพัก</h3>
          <div class="modal-meta"></div>
          <div class="modal-amenities"></div>
          <div class="modal-cta" hidden aria-hidden="true">
            <a href="./checkout.html" class="btn modal-select" data-room="">Select Room</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Backdrop & Drawer (placed at end of body to avoid DOM conflicts) -->
  <div class="bs-backdrop" data-bs-backdrop hidden></div>
  <aside class="bs-drawer" role="dialog" aria-modal="true" aria-labelledby="bs-title" data-bs-drawer aria-hidden="true">
    <header>
      <h3 id="bs-title">Booking Summary</h3>
      <button class="bs-close" type="button" data-bs-close>ปิด</button>
    </header>
    <main>
      <ul class="bs-items" data-bs-list></ul>
      <div class="bs-summaryRow bs-total"><span>รวม</span> <span data-bs-total>THB 0.00</span></div>
    </main>
    <div class="bs-cta"><button class="bs-btnPrimary" type="button" data-bs-book>จอง</button></div>
  </aside>

</body>
</html>
