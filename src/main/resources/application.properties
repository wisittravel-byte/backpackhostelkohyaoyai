# Spring Boot Application config
server.port=8081

# DataSource (MySQL)
# Env overrides supported: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS
# In production, set DB_HOST/DB_PORT to your MySQL server
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:backpackhostel}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:Kz13579@}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# CORS (we will configure in code as well)
# Rates table mapping for JDBC endpoint
app.rates.table=backpackhostel.rate_plan_prices
# If your table uses different column names, uncomment and set them here
# app.rates.columns.id=id
# app.rates.columns.propertyId=property_id
# app.rates.columns.roomTypeId=room_type_id
# app.rates.columns.ratePlanId=rate_plan_id
# app.rates.columns.stayDate=stay_date
# app.rates.columns.currency=currency
# app.rates.columns.price=price
# app.rates.columns.taxIncluded=tax_included
# app.rates.columns.createdAt=created_at

# Room types table mapping
app.roomtypes.table=backpackhostel.room_types
# Map columns to your schema (Thai defaults)
# Uncommented so backend returns correct fields for the UI
app.roomtypes.columns.id=id
# Your table doesn't have property_id; leave unmapped so no filter is applied
# app.roomtypes.columns.propertyId=property_id
app.roomtypes.columns.code=code
app.roomtypes.columns.name=name_th
app.roomtypes.columns.description=description_th
# No direct image_url column in schema; keep unset (backend will return null)
# app.roomtypes.columns.imageUrl=image_url

# Dev diagnostics (consider relaxing only in local dev)
server.error.include-message=always
server.error.include-binding-errors=always
# Add ?trace=true to get stacktrace in error response
server.error.include-stacktrace=on_param
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.example.hostel=DEBUG
logging.level.com.example.hostel.repo=DEBUG

# CORS origins (comma-separated). Example for production:
# app.cors.origins=https://wisittravel-byte.github.io,https://backpackhostel.vercel.app,https://your-custom-domain