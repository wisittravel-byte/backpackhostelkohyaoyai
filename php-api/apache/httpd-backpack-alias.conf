# Apache Alias Configuration for Backpack Hostel PHP API
# ไฟล์นี้ใช้สำหรับตั้งค่า Alias เพื่อเข้าถึง PHP API
# วางไฟล์นี้ใน C:/Learnning coding/php-api/apache/httpd-backpack-alias.conf

# Alias สำหรับ PHP API
Alias /php-api "C:/Learnning coding/php-api"
Alias /backpack-api "C:/Learnning coding/php-api"
Alias /api "C:/Learnning coding/php-api"

# Directory Configuration สำหรับ PHP API
<Directory "C:/Learnning coding/php-api">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    
    # PHP Configuration
    php_value default_charset "UTF-8"
    php_value mbstring.internal_encoding "UTF-8"
    php_value mbstring.http_output "UTF-8"
    php_value display_errors "Off"
    php_value log_errors "On"
    php_value error_log "C:/Learnning coding/php-api/error.log"
    php_value memory_limit "256M"
    php_value max_execution_time "60"
    
    # Security Headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options SAMEORIGIN
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # CORS Headers สำหรับ API
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE"
    Header always set Access-Control-Allow-Headers "Content-Type, Accept, Authorization, X-Requested-With"
    Header always set Access-Control-Max-Age "86400"
    
    # Handle preflight OPTIONS requests
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ - [R=200,L]
    
    # JSON Response headers
    <FilesMatch "\.php$">
        Header set Content-Type "application/json; charset=utf-8"
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </FilesMatch>
    
    # Deny access to sensitive files
    <Files "config.php">
        Require all denied
    </Files>
    
    <Files ".env*">
        Require all denied
    </Files>
    
    <Files "*.log">
        Require all denied
    </Files>
</Directory>

# Alias สำหรับ Static Assets (ถ้าต้องการ)
Alias /backpack-static "C:/Learnning coding/src/main/resources/static"

# Serve the booking site's public folder at /public
# Use trailing slashes for directory aliasing to avoid path concatenation issues
Alias /public/ "C:/Learnning coding/src/main/resources/static/public/"
# Alternative aliases in case /public is reserved by another config
Alias /bp-public/ "C:/Learnning coding/src/main/resources/static/public/"
Alias /site/ "C:/Learnning coding/src/main/resources/static/public/"

<Directory "C:/Learnning coding/src/main/resources/static/public/">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.html index.htm
    
    # Cache static assets from /public
    <FilesMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        Header set Cache-Control "max-age=2592000, public"
    </FilesMatch>
    
    # CORS for static (optional)
    Header always set Access-Control-Allow-Origin "*"
</Directory>

# Directory blocks for alternative aliases
<Directory "C:/Learnning coding/src/main/resources/static/public/">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.html index.htm
    <FilesMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        Header set Cache-Control "max-age=2592000, public"
    </FilesMatch>
    Header always set Access-Control-Allow-Origin "*"
</Directory>

<Directory "C:/Learnning coding/src/main/resources/static/">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    
    # Cache static files
    <FilesMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        Header set Cache-Control "max-age=2592000, public"
        Header set Expires "30 days"
    </FilesMatch>
    
    # CORS for static assets
    Header always set Access-Control-Allow-Origin "*"
</Directory>

# Additional MIME types
<IfModule mod_mime.c>
    AddType application/json .json
    AddType application/javascript .js
    AddCharset UTF-8 .php .html .css .js .json
</IfModule>

# Compression for API responses
<IfModule mod_deflate.c>
    <Location "/backpack-api">
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    </Location>
    
    <Location "/api">
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    </Location>
</IfModule>