# Apache Virtual Host Configuration for Backpack Hostel PHP API
# เพิ่มส่วนนี้ใน httpd.conf หรือ httpd-vhosts.conf

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/Learnning coding"
    
    # กำหนด Directory permissions
    <Directory "C:/Learnning coding">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # เปิดใช้งาน PHP
        <IfModule mod_php.c>
            php_flag engine on
        </IfModule>
    </Directory>
    
    # กำหนดเฉพาะสำหรับ php-api directory
    <Directory "C:/Learnning coding/php-api">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # PHP Configuration
        php_value default_charset "UTF-8"
        php_value mbstring.internal_encoding "UTF-8"
        php_value mbstring.http_output "UTF-8"
        
        # Security headers
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
        Header always set X-XSS-Protection "1; mode=block"
        
        # CORS headers for API
        Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Accept, Authorization"
        Header always set Access-Control-Max-Age "86400"
    </Directory>
    
    # Error and Access logs
    ErrorLog "logs/backpack_error.log"
    CustomLog "logs/backpack_access.log" combined
</VirtualHost>

# Alternative Virtual Host สำหรับ API subdomain (ถ้าต้องการ)
<VirtualHost *:80>
    ServerName api.backpack.local
    DocumentRoot "C:/Learnning coding/php-api"
    
    <Directory "C:/Learnning coding/php-api">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # PHP settings for API
        php_value default_charset "UTF-8"
        php_value display_errors "Off"
        php_value log_errors "On"
        php_value error_log "C:/Learnning coding/php-api/error.log"
        
        # เพิ่ม CORS support
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Accept"
    </Directory>
    
    ErrorLog "logs/api_error.log"
    CustomLog "logs/api_access.log" combined
</VirtualHost>