# backpack-hostel.conf
# Custom Apache configuration สำหรับ Backpack Hostel PHP API
# วางไฟล์นี้ใน conf/extra/ directory ของ Apache

# Virtual Host สำหรับ Main Site
<VirtualHost *:80>
    ServerName localhost
    ServerAlias backpack.local
    DocumentRoot "C:/Learnning coding"
    
    # Directory Configuration
    <Directory "C:/Learnning coding">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # PHP Configuration
        php_value default_charset "UTF-8"
        php_value mbstring.internal_encoding "UTF-8"
        php_value mbstring.http_output "UTF-8"
        php_value memory_limit "256M"
        php_value max_execution_time "60"
        php_value post_max_size "50M"
        php_value upload_max_filesize "50M"
    </Directory>
    
    # PHP API Directory
    <Directory "C:/Learnning coding/php-api">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # API specific PHP settings
        php_value display_errors "Off"
        php_value log_errors "On"
        php_value error_log "C:/Learnning coding/php-api/error.log"
        
        # CORS Headers
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE"
        Header always set Access-Control-Allow-Headers "Content-Type, Accept, Authorization, X-Requested-With"
        Header always set Access-Control-Max-Age "86400"
        
        # Security Headers
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options SAMEORIGIN
        Header always set X-XSS-Protection "1; mode=block"
        
        # Handle OPTIONS requests
        RewriteEngine On
        RewriteCond %{REQUEST_METHOD} OPTIONS
        RewriteRule ^(.*)$ - [R=200,L]
    </Directory>
    
    # Static Assets
    <Directory "C:/Learnning coding/src/main/resources/static">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Cache static files
        <FilesMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
            Header set Cache-Control "max-age=2592000, public"
        </FilesMatch>
    </Directory>
    
    # Logs
    ErrorLog "logs/backpack_error.log"
    CustomLog "logs/backpack_access.log" combined
    LogLevel warn
</VirtualHost>

# API Subdomain Virtual Host (Optional)
<VirtualHost *:80>
    ServerName api.backpack.local
    DocumentRoot "C:/Learnning coding/php-api"
    
    <Directory "C:/Learnning coding/php-api">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # PHP settings optimized for API
        php_value default_charset "UTF-8"
        php_value display_errors "Off"
        php_value log_errors "On"
        php_value error_log "C:/Learnning coding/php-api/api_error.log"
        php_value memory_limit "128M"
        php_value max_execution_time "30"
        
        # JSON Response optimization
        php_value zlib.output_compression "On"
        php_value zlib.output_compression_level "6"
        
        # Security
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        
        # CORS for API
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Accept"
        Header always set Access-Control-Max-Age "3600"
    </Directory>
    
    ErrorLog "logs/api_error.log"
    CustomLog "logs/api_access.log" combined
</VirtualHost>

# Global PHP Configuration
<IfModule mod_php.c>
    php_value expose_php "Off"
    php_value session.cookie_httponly "On"
    php_value session.cookie_secure "Off"
    php_value session.use_strict_mode "On"
</IfModule>

# MIME Types สำหรับ API
<IfModule mod_mime.c>
    AddType application/json .json
    AddType application/javascript .js
    AddCharset UTF-8 .php .html .css .js .json
</IfModule>

# Compression สำหรับ API responses
<IfModule mod_deflate.c>
    <Location "/php-api">
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    </Location>
</IfModule>